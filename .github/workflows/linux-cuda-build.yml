name: Linux CUDA 13 build

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-cuda13:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container: nvidia/cuda:13.2.0-devel-ubuntu24.04
    defaults:
      run:
        shell: bash
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 1G
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates build-essential cmake ninja-build \
            libssl-dev python3 time ccache zstd

      - name: Trust the checked-out workspace in the CUDA container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Prepare pinned llama.cpp integration
        run: |
          python3 scripts/prepare-backends.py --backend llamacpp
          python3 scripts/prepare-backends.py --backend llamacpp --check

      - name: Prepare the CUDA driver stub for linking
        run: |
          mkdir -p "$RUNNER_TEMP/cuda-driver-stubs"
          ln -s /usr/local/cuda/lib64/stubs/libcuda.so \
            "$RUNNER_TEMP/cuda-driver-stubs/libcuda.so.1"

      - name: Configure the Linux CUDA 13 build
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DBUILD_SHARED_LIBS=ON -DKVMEM_BUILD_LLAMA=ON
          -DGGML_CUDA=ON -DGGML_NATIVE=OFF
          -DGGML_CCACHE=OFF -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_CUDA_COMPILER_LAUNCHER=ccache
          -DCMAKE_CUDA_ARCHITECTURES=120a-real
          -DCMAKE_EXE_LINKER_FLAGS="-Wl,-rpath-link,$RUNNER_TEMP/cuda-driver-stubs"

      - name: Build and link all targets
        run: |
          nproc
          free -h
          ccache --zero-stats
          /usr/bin/time -v cmake --build build --parallel 2

      - name: Run the test suite for the configured build
        run: ctest --test-dir build --output-on-failure --no-tests=error

      - name: Compiler cache statistics
        if: ${{ always() }}
        run: ccache --show-stats
